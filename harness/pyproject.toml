[project]
name = "securepatch-bench"
version = "0.0.1"
description = "Headless research harness for SecurePatch AI: runs repeated scans across multiple AI providers, applies fixes in isolated sandboxes, verifies them, and records results for analysis."
requires-python = ">=3.9"

# The core stays dependency-free: regex detection only needs Node (shelled out
# to @securepatch/core) and the standard library. AI detection needs the
# provider SDKs below — install with `pip install -e .[providers]`.
dependencies = []

[project.optional-dependencies]
# Provider SDKs for AI detection (the `detect` / `bench --detector ai` paths).
# Imported lazily, so they are only required when actually running AI scans.
providers = [
    "openai",
    "anthropic",
    "python-dotenv",  # loads API keys from harness/.env at CLI startup
    # gemini + ollama adapters land next; google-genai / local HTTP.
]
analysis = [
    "pandas",
    "jupyter",
]

[project.scripts]
securepatch-bench = "securepatch_bench.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["securepatch_bench", "securepatch_bench.providers"]
