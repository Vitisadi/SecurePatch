[project]
name = "securepatch-bench"
version = "0.0.1"
description = "Headless research harness for SecurePatch AI: runs repeated scans across multiple AI providers, applies fixes in isolated sandboxes, verifies them, and records results for analysis."
requires-python = ">=3.9"

# Runtime dependencies are intentionally empty for the Week 1 skeleton: the
# detection bridge only needs Node (shelled out to @securepatch/core) and the
# Python standard library. Provider SDKs and analysis tooling arrive in Week 2.
dependencies = []

[project.optional-dependencies]
# Installed in Week 2 when the provider adapters land.
providers = [
    "openai",
    "anthropic",
    "google-genai",
    # ollama is hit over its local HTTP API; no SDK strictly required.
]
analysis = [
    "pandas",
    "jupyter",
]

[project.scripts]
securepatch-bench = "securepatch_bench.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["securepatch_bench"]
